[package]
name = "afrim-desktop-tsf"
version = "0.1.0"
edition.workspace = true
description = "Windows TSF (Text Services Framework) frontend for the afrim-desktop afrim IME"
license.workspace = true
authors = ["togatoga", "Brady Fomegne <brady.fomegne@outlook.com>"]
repository.workspace = true
homepage.workspace = true
keywords = ["afrim", "ime", "tsf", "windows", "input-method"]
categories = ["text-processing", "internationalization"]

[lib]
name = "afrim_desktop_tsf"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Core engine (reuse afrim-desktop-im's InputMethodEngine directly)
afrim-desktop-im = { path = "../afrim-desktop-im" }

# Windows API bindings
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
windows-core = "0.58"

# Global state
once_cell = "1"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
