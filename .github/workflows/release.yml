name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build .app bundle
        run: |
          cd afrim-desktop-macos
          bash scripts/build.sh arm64
      - name: Verify .app bundle
        run: |
          test -f afrim-desktop-macos/build/AfrimDesktop.app/Contents/MacOS/AfrimDesktopInputMethod
          test -f afrim-desktop-macos/build/AfrimDesktop.app/Contents/Info.plist
          codesign --verify afrim-desktop-macos/build/AfrimDesktop.app
      - name: Package .app
        run: |
          cd afrim-desktop-macos/build
          ditto -c -k --keepParent AfrimDesktop.app AfrimDesktop-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AfrimDesktop-macos-arm64
          path: afrim-desktop-macos/build/AfrimDesktop-macos-arm64.zip

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build release DLL
        run: cargo build -p afrim-desktop-tsf --release
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
      - name: Build NSIS installer
        run: |
          copy target\release\afrim_desktop_tsf.dll afrim-desktop-tsf\installer\
          makensis /DVERSION=${{ github.ref_name }} afrim-desktop-tsf\installer\afrim-desktop-installer.nsi
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: AfrimDesktop-windows-x86_64
          path: afrim-desktop-tsf/installer/AfrimDesktop-Setup-*.exe

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/AfrimDesktop-macos-arm64/AfrimDesktop-macos-arm64.zip
            artifacts/AfrimDesktop-windows-x86_64/AfrimDesktop-Setup-*.exe
