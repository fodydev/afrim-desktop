[workspace]
members = ["afrim-desktop-im", "afrim-desktop-tsf", "afrim-desktop-macos"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fodydev/afrim-desktop"
homepage = "https://github.com/fodydev/afrim-desktop"

[workspace.dependencies]
# Shared across all 3 crates
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared across 2 crates
toml = "0.8"

# Afrim input method engine (core of afrim-desktop)
afrim-config = { version = "0.4.8", default-features = false }
afrim-preprocessor = "0.7.0"
afrim-translator = { version = "0.2.4", default-features = false }

# Dev dependencies shared
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
